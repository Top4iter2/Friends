<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a10" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Киноархив</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="app-header">
    <div class="app-header__row">
      <div>
        <p class="app-header__eyebrow">Наш архив</p>
        <h1 class="app-header__title">Кино<em>архив</em></h1>
      </div>
      <div class="app-header__stat">
        <span class="app-header__stat-num" id="statCount">0</span>
        <span class="app-header__stat-label">фильмов</span>
      </div>
    </div>

    <nav class="tabs" id="tabs">
      <div class="tab-indicator" id="tabIndicator"></div>
      <button class="tab is-active" data-filter="all">Все</button>
      <button class="tab" data-filter="watch">Хочу</button>
      <button class="tab" data-filter="watched">Смотрено</button>
    </nav>
  </header>

  <main class="content">
    <div class="list" id="list"></div>

    <div class="empty" id="empty" hidden>
      <div class="empty__icon">🎬</div>
      <h2 class="empty__title">Архив пуст</h2>
      <p class="empty__text">Добавьте первый фильм, который хотите посмотреть вместе.</p>
      <button class="btn btn--primary empty__cta" id="emptyAddBtn">Добавить фильм</button>
    </div>
  </main>

  <button class="fab" id="fab" aria-label="Добавить фильм">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none">
      <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
    </svg>
  </button>

  <div class="sheet-backdrop" id="backdrop"></div>

  <section class="sheet" id="sheet" aria-hidden="true">
    <div class="sheet__handle"></div>
    <h2 class="sheet__title" id="sheetTitle">Новый фильм</h2>

    <form class="form" id="form">
      <label class="field">
        <span class="field__label">Название фильма</span>
        <input class="field__input" type="text" id="inputTitle"
               placeholder="Например, Интерстеллар" autocomplete="off" maxlength="120" required />
      </label>

      <div class="field">
        <span class="field__label">Статус</span>
        <div class="segmented" id="statusSegmented">
          <button type="button" class="segmented__btn is-active" data-status="watch">Хочу посмотреть</button>
          <button type="button" class="segmented__btn" data-status="watched">Смотрено</button>
        </div>
      </div>

      <div class="field" id="ratingField" hidden>
        <span class="field__label">Ваша оценка</span>
        <div class="stars stars--input" id="starsInput"></div>
      </div>

      <div class="form__actions">
        <button type="button" class="btn btn--ghost" id="deleteBtn" hidden>Удалить</button>
        <button type="submit" class="btn btn--primary">Сохранить</button>
      </div>
    </form>
  </section>

  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
